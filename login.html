<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Cifra</title>
<meta name="shopify-api-key" content="prototype">
<script src="https://cdn.shopify.com/shopifycloud/polaris-2.0-rc.js"></script>
<link rel="stylesheet" href="shared/cifra.css">
<script src="shared/cifra.js" defer></script>
<style>
  /* Solo el layout de la página es custom; todo lo de adentro es <s-*>. */
  .c-auth { min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; }
  .c-auth__card { width: 100%; max-width: 400px; }
  .c-auth [hidden] { display: none !important; }
  .c-auth__logo { width: 40px; height: 40px; display: block; }
  .c-auth__social img { width: 20px; height: 20px; display: block; }
  /* Título de la card: s-heading no permite tamaño, así que el h1 replica el del login de Shopify (20px / 650) */
  .c-auth__title { margin: 0; font: 650 20px/28px var(--c-font); letter-spacing: -.2px; color: var(--c-text); }
</style>
</head>
<body class="no-fade">

<!--
  Pantalla: Log in / Sign up de la web app (/login, /signup). Nueva: dentro del admin Shopify ya autentica.
  Sigue el login actual de Shopify (accounts.shopify.com): card blanca, email primero con botón primario,
  separador "or" y botones de proveedor con su logo; el código llega por email.
  Pasos (hash): #login (default) → #check-email → home.html
                #signup → #check-email → onboarding.html
  Nativo → s-section, s-stack, s-grid, s-clickable (botones de proveedor, 48px de alto), s-text, s-email-field, s-text-field, s-button, s-divider, s-link
  Custom → centrado de la página (.c-auth) y el título h1 (s-heading no tiene tamaño)
-->
<main class="c-auth" data-custom="AuthLayout">

  <!-- Paso 1: email + proveedores -->
  <div class="c-auth__card" data-step="start">
    <s-section padding="base">
      <s-stack gap="large-200" padding="base">
        <s-stack gap="base">
          <img class="c-auth__logo" src="assets/logos/cifra.svg" alt="Cifra">
          <s-stack gap="small-200">
            <h1 class="c-auth__title" data-mode-text="Log in to Cifra|Create your Cifra account">Log in to Cifra</h1>
            <s-text color="subdued" data-mode-text="Welcome back. See your real profit across all your stores.|See your real profit in minutes, across all your stores.">Welcome back. See your real profit across all your stores.</s-text>
          </s-stack>
        </s-stack>

        <s-stack gap="base">
          <s-email-field label="Email" name="email" autocomplete="email" placeholder="you@store.com" data-email></s-email-field>
          <s-button variant="primary" inlineSize="fill" data-email-continue>Continue with email</s-button>
        </s-stack>

        <s-grid gridTemplateColumns="1fr auto 1fr" gap="base" alignItems="center">
          <s-divider></s-divider>
          <s-text color="subdued">or</s-text>
          <s-divider></s-divider>
        </s-grid>

        <s-grid gridTemplateColumns="1fr 1fr" gap="base" class="c-auth__social">
          <s-clickable border="base" borderRadius="large" background="subdued" blockSize="48px" inlineSize="100%" accessibilityLabel="Continue with Shopify" data-finish><s-stack alignItems="center" justifyContent="center" blockSize="100%"><img src="assets/logos/shopify-mark.svg" alt=""></s-stack></s-clickable>
          <s-clickable border="base" borderRadius="large" background="subdued" blockSize="48px" inlineSize="100%" accessibilityLabel="Continue with Google" data-finish><s-stack alignItems="center" justifyContent="center" blockSize="100%"><img src="assets/logos/google.svg" alt=""></s-stack></s-clickable>
        </s-grid>

        <div data-mode="login"><s-stack direction="inline" gap="small-200" justifyContent="center"><s-text color="subdued">New to Cifra?</s-text><s-link href="#signup">Get started</s-link></s-stack></div>
        <div data-mode="signup" hidden><s-stack direction="inline" gap="small-200" justifyContent="center"><s-text color="subdued">Already have an account?</s-text><s-link href="#login">Log in</s-link></s-stack></div>
      </s-stack>
    </s-section>
  </div>

  <!-- Paso 2: código por email -->
  <div class="c-auth__card" data-step="check-email" hidden>
    <s-section padding="base">
      <s-stack gap="large-200" padding="base">
        <s-stack gap="base">
          <img class="c-auth__logo" src="assets/logos/cifra.svg" alt="Cifra">
          <s-stack gap="small-200">
            <h1 class="c-auth__title">Check your email</h1>
            <s-text color="subdued">We sent a 6-digit code to <s-text type="strong" data-email-out>you@store.com</s-text>.</s-text>
          </s-stack>
        </s-stack>
        <s-stack gap="base">
          <s-text-field label="Code" name="code" autocomplete="one-time-code" maxLength="6" placeholder="000000" details="Prototype: any 6 digits work." data-code></s-text-field>
          <s-button variant="primary" inlineSize="fill" data-code-continue>Log in</s-button>
        </s-stack>
        <s-stack direction="inline" gap="base" justifyContent="center">
          <s-link data-resend>Resend code</s-link>
          <s-link href="#" data-back>Use a different email</s-link>
        </s-stack>
      </s-stack>
    </s-section>
  </div>

</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
  let mode = "login";
  const steps = document.querySelectorAll("[data-step]");
  const show = (step) => steps.forEach((s) => { s.hidden = s.dataset.step !== step; });
  const setMode = (m) => {
    mode = m;
    document.querySelectorAll("[data-mode]").forEach((n) => { n.hidden = n.dataset.mode !== m; });
    document.querySelectorAll("[data-mode-text]").forEach((n) => { n.textContent = n.dataset.modeText.split("|")[m === "signup" ? 1 : 0]; });
    document.title = (m === "signup" ? "Sign up" : "Log in") + " · Cifra";
  };
  const finish = () => { location.href = mode === "signup" ? "onboarding.html" : "home.html"; };
  const route = () => {
    const h = location.hash.slice(1);
    if (h === "check-email") show(h);
    else { setMode(h === "signup" ? "signup" : "login"); show("start"); }
  };
  window.addEventListener("hashchange", route);
  route();

  document.querySelectorAll("[data-finish]").forEach((b) => b.addEventListener("click", finish));

  const email = document.querySelector("[data-email]");
  const sendCode = () => {
    const v = (email.value || "").trim();
    if (!/^\S+@\S+\.\S+$/.test(v)) { email.error = "Enter a valid email address"; return; }
    email.error = "";
    document.querySelector("[data-email-out]").textContent = v;
    location.hash = "check-email";
  };
  document.querySelector("[data-email-continue]").addEventListener("click", sendCode);
  email.addEventListener("keydown", (e) => { if (e.key === "Enter") sendCode(); });

  const code = document.querySelector("[data-code]");
  const login = () => {
    if (!/^\d{6}$/.test((code.value || "").trim())) { code.error = "Enter the 6-digit code"; return; }
    finish();
  };
  document.querySelector("[data-code-continue]").addEventListener("click", login);
  code.addEventListener("input", () => { code.error = ""; if (/^\d{6}$/.test(code.value)) finish(); });
  code.addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
  document.querySelector("[data-back]").addEventListener("click", (e) => { e.preventDefault(); location.hash = mode; });
  document.querySelector("[data-resend]").addEventListener("click", (e) => { e.target.textContent = "Code sent"; setTimeout(() => { e.target.textContent = "Resend code"; }, 2000); });
});
</script>

</body>
</html>
